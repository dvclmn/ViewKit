## All relative paths specified in the configuration file (input_dir,
## output_dir, inputs, templatePath, output) are relative to the
## location of the configuration file itself.
input_dir: Sources/BaseHelpers/
output_dir: Sources
##   - To know which params are supported for a template, use `swiftgen template doc xcassets swift5` to open the template documentation on GitHub.
xcassets:
  ## The file(s)/dir(s) to parse (e.g. the path to your assets catalog for the xcassets command
  inputs:
    - Assets.xcassets
  outputs:
    - templatePath: xcassets-swift5.stencil
      params:
        publicAccess: true
      output: BaseColour/Swatch+Generated.swift
